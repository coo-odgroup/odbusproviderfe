<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="timer" [fullScreen]="true">
  <p style="color: white"> Loading... </p>
</ngx-spinner>
<div class="row">
  <div class="col-sm-12">
    <app-card [hidHeader]="false" cardTitle="Api Log Report" cardClass="card-datatable" [options]="false"
      cardClass=" table-border-style user-profile-list " [isCardFooter]="false">
      <div class=" mb-3">
        <div class="row ">
          <div class="col-12">
            <form [formGroup]="searchFrom">
              <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-4">
                  <div class="row">
                    <div class="form-group col-6">
                      <div class="form-group row">
                        <input type="date" class="form-control sml_input" placeholder="Enter pnr" required
                          formControlName="date" />
                      </div>
                    </div>
                    <div class="form-group col-6">
                      <div class="dropdown w-100">
                        <select class="form-control sml_input" formControlName="user" (change)=search()>
                          <option value=486>Paytm</option>
                          <option value=559>Abhi Bus</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-md-5">
                  <button type="button" class="btn btn-success  sml_input" (click)="search()" title="search">
                    <i class="fas fa-search"> </i> Search
                  </button>
                  <button type="button" class="btn btn-danger sml_input" (click)="refresh()" title="refresh">
                    <i class="fas fa-sync-alt"> </i> Refresh
                  </button>
                  <div class="dropdown float-right">
                    <select class="form-control sml_input" formControlName="rows_number" (change)=search()>
                      <option value=10>10</option>
                      <option value=25>25</option>
                      <option value=50>50</option>
                      <option value=100>100</option>
                      <option value=250>250</option>
                      <option value=500>500</option>
                      <option value=1000>1000</option>
                    </select>
                  </div>
                </div>
              </div>
            </form>
          </div>

        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">PNR</th>
              <th scope="col">Transaction Id</th>
              <th scope="col">Response Status</th>
              <th scope="col">Created On</th>
              <th scope="col">User</th>
            </tr>
          </thead>
          <tbody *ngIf="apilogreport?.length != 0">
            <tr *ngFor="let list of apilogreport; let i=index;" [ngClass]="{'row-error': list.response_status != 1}">
              <td>{{i+1}}</td>
              <td>{{list.pnr}}</td>
              <td>{{list.transaction_id}}</td>
              <td>{{list.response_status}}</td>
              <td>{{list.created_at | date: 'dd/MM/yyyy'}}</td>
              <td>{{list.user_name}}</td>
            </tr>

          </tbody>
          <tbody *ngIf="apilogreport?.length == 0">
            <tr>
              <td colspan="6" class="no-data-available">No data!</td>
            </tr>
          <tbody>
        </table>

        <div *ngIf="pagination?.length != 0" class="hide_print container">
          <div class="row">
            <div class="col-6">

              <div class="col-12">
                <p class=" row mt-3 ml-1"> Showing {{pagination?.to}} of {{pagination?.total}} records. </p>
              </div>
            </div>
            <div class="col-6">
              <div class="d-flex flex-row-reverse mb-4 text-center" *ngIf="pagination?.links">
                <nav class="my-1 pt-1 ">
                  <ul class="pagination pagination-circle pg-blue mb-0">
                    <li (click)="search(pagination.links.first_page_url,statusLabel)"
                      class="page-item {{ pagination.current_page == 1 ? 'disabled' : '' }} clearfix d-none d-md-block">
                      <a class="page-link">First</a>
                    </li>
                    <li class="page-item " *ngFor="let b of pagination.links ; let i = index ">
                      <a class="page-link {{ pagination.current_page == b.label ? 'active' : '' }}"
                        (click)="(b.url) ? search(b.url) : ''" [innerHTML]="page(b.label)"></a>
                    </li>
                    <li
                      class="page-item {{ pagination.links.last_page == 1 ? 'disabled' : '' }} clearfix d-none d-md-block"
                      (click)="search(pagination.links.last_page_url,statusLabel)">
                      <a class="page-link">Last</a>
                    </li>
                  </ul>
                </nav>
              </div>

            </div>

          </div>
        </div>

      </div>
    </app-card>
  </div>
</div>
