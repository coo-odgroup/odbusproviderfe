<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="timer" [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>

<div class="row">

  <div class="col-sm-12">

    <app-card [hidHeader]="false" cardTitle="Tags" cardClass="card-datatable table-border-style user-profile-list"
      [options]="false" [isCardFooter]="false">

      <!-- ========================= -->
      <!-- Search Section -->
      <!-- ========================= -->

      <div class="row mb-2">

        <div class="col-12">

          <form [formGroup]="searchForm" class="editForm" novalidate>

            <div class="row">

              <!-- Add Button -->

              <div class="col-md-2">

                <div class="form-group text-left">

                  <button type="button" class="btn sml_input btn-success mb-2"
                    (click)="ResetAttributes(); OpenModal(content)">

                    Add Tags

                  </button>

                </div>

              </div>

              <!-- Status -->

              <div class="col-md-3" *ngIf="role_id==1">

                <select class="form-control sml_input" formControlName="status" (change)="getallData()">

                  <option value="">-Status-</option>
                  <option value="1">Active</option>
                  <option value="0">Deactive</option>

                </select>

              </div>

              <!-- Search -->

              <div class="col-md-3" *ngIf="role_id==1">

                <div class="input-group">
                  <input type="text" class="form-control sml_input" placeholder="Search Here" formControlName="searchBy">
                  <div class="input-group-append">
                    <button type="button" class="btn btn-success sml_input" (click)="getallData()" title="search">
                      <i class="fas fa-search"></i>
                    </button>
                  </div>
                </div>

              </div>

              <!-- Refresh + Per Page -->

              <div class="col-md-4">
                <button type="button" class="btn sml_input btn-primary" (click)="getallData()" *ngIf="role_id==1">
                  <i class="fas fa-search-alt"></i> Search
                </button>

                <button type="button" class="btn sml_input btn-danger" (click)="refresh()" *ngIf="role_id==1">
                  <i class="fas fa-sync-alt"></i> Refresh
                </button>

                <div class="dropdown float-right">

                  <select class="form-control sml_input" formControlName="per_page" (change)="getallData()">

                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>

                  </select>

                </div>

              </div>

            </div>

          </form>

        </div>

      </div>

      <!-- ========================= -->
      <!-- Table -->
      <!-- ========================= -->

      <div class="table-responsive">

        <table class="table table-striped">

          <thead>

            <tr>

              <th>#</th>
              <th>Tag Name</th>
              <th>Slug</th>
              <th>Status</th>
              <th>Created By</th>
              <th width="100" class="hide_print">Action</th>

            </tr>

          </thead>

          <!-- Data -->

          <tbody *ngIf="tagdata?.length != 0">

            <tr *ngFor="let tag of tagdata; let i = index">

              <td>{{ i + 1 }}</td>

              <td>{{ tag.tag_name }}</td>

              <td>{{ tag.slug }}</td>

              <!-- Status -->

              <td>

                <label *ngIf="tag.active_status == 1" class="badge badge-light-success pointer"
                  (click)="changeStatus($event, tag.id, tag.active_status)">

                  Active

                </label>

                <label *ngIf="tag.active_status == 0" class="badge badge-light-warning pointer"
                  (click)="changeStatus($event, tag.id, tag.active_status)">

                  Deactive

                </label>

              </td>

              <!-- Created By -->

              <td>

                <span *ngIf="tag.created_by == 1">ODBUS</span>

              </td>

              <!-- Actions -->

              <td class="hide_print">

                <div class="overlay-edit">

                  <!-- Edit -->

                  <button type="button" class="btn btn-icon btn-success"
                    (click)="editcategory(tag); OpenModal(content)">

                    <i class="feather icon-edit"></i>

                  </button>

                  <!-- Delete -->

                  <button type="button" class="btn btn-icon btn-danger"
                    (click)="openConfirmDialog(confirmDialog, tag.id)">

                    <i class="feather icon-trash-2"></i>

                  </button>

                </div>

              </td>

            </tr>

          </tbody>

          <!-- No Data -->

          <tbody *ngIf="tagdata?.length == 0">
            <tr>
              <td colspan="6" class="text-center text-danger">
                No Data Found
              </td>
            </tr>
          </tbody>
        </table>

      </div>

      <!-- ========================= -->
      <!-- Delete Modal -->
      <!-- ========================= -->

      <ng-template #confirmDialog let-modal>

        <div class="modal-header">

          <h5>Would you Like to Delete the Record?</h5>

          <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">

            <span aria-hidden="true">&times;</span>

          </button>

        </div>

        <div class="modal-body">

          Are you sure you want to delete this tag?

        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-primary" (click)="deleteRecord()">

            Confirm Delete

          </button>

          <button type="button" class="btn btn-default" (click)="modal.dismiss('Cross click')">

            Cancel

          </button>

        </div>

      </ng-template>

      <!-- ========================= -->
      <!-- Add/Edit Modal -->
      <!-- ========================= -->

      <ng-template #content let-modal>

        <div class="modal-header">

          <h5>{{ ModalHeading }}</h5>

          <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">

            <span aria-hidden="true">&times;</span>

          </button>

        </div>

        <div class="modal-body">

          <form [formGroup]="tagform" novalidate>

            <div class="row">

              <!-- Tag Name -->

              <div class="col-md-6">

                <div class="form-group">

                  <label>

                    Tag Name
                    <span class="text-danger">*</span>

                  </label>

                  <input type="text" class="form-control" formControlName="tag_name" placeholder="Enter Tag Name">

                  <small class="text-danger" *ngIf="tagform.controls.tag_name.touched &&
                           tagform.controls.tag_name.errors?.required">

                    Tag Name is required

                  </small>

                </div>

              </div>

              <!-- Slug -->

              <div class="col-md-6">

                <div class="form-group">

                  <label>

                    Slug
                    <span class="text-danger">*</span>

                  </label>

                  <input type="text" class="form-control" formControlName="slug" placeholder="Slug" readonly>

                  <small class="text-danger" *ngIf="tagform.controls.slug.touched &&
                           tagform.controls.slug.errors?.required">

                    Slug is required

                  </small>

                </div>

              </div>

            </div>

          </form>

        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-primary" (click)="addTag()">

            {{ ModalBtn }}

          </button>

          <button type="button" class="btn btn-default" (click)="modal.dismiss('Cross click')">

            Close

          </button>

        </div>

      </ng-template>

    </app-card>

  </div>

</div>
