<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="timer" [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>

<div class="row">
  <div class="col-sm-12">

    <app-card [hidHeader]="false" cardTitle="Tag Maps" cardClass="card-datatable table-border-style user-profile-list"
      [options]="false" [isCardFooter]="false">

      <!-- FILTER SECTION -->
      <div class="row mb-3">
        <div class="col-12">

          <form [formGroup]="searchForm" novalidate>

            <div class="row">

              <!-- ADD BUTTON -->
              <div class="col-md-2 mb-2">
                <button type="button" class="btn btn-success sml_input" (click)="ResetAttributes(); OpenModal(content)">

                  Add Tag Map
                </button>
              </div>

              <!-- STATUS -->
              <div class="col-md-3 mb-2" *ngIf="role_id == 1">
                <!-- <select class="form-control sml_input" formControlName="status">

                  <option value="">-Status-</option>
                  <option value="1">Active</option>
                  <option value="0">Pending</option>

                </select> -->
              </div>

              <!-- SEARCH -->
              <div class="col-md-3 mb-2" *ngIf="role_id == 1">

                <div class="input-group">

                  <input type="text" class="form-control sml_input" placeholder="Search Here"
                    formControlName="searchBy">

                  <div class="input-group-append">

                    <button type="button" class="btn btn-success sml_input" (click)="getAll()">

                      <i class="fas fa-search"></i>

                    </button>

                  </div>

                </div>

              </div>

              <!-- REFRESH + PER PAGE -->
              <div class="col-md-4 mb-2">

                <button type="button" class="btn btn-danger sml_input" *ngIf="role_id == 1" (click)="refresh()">

                  <i class="fas fa-sync-alt"></i> Refresh
                </button>

                <div class="dropdown float-right">

                  <select class="form-control sml_input" formControlName="per_page" (change)="getAll()">

                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>

                  </select>

                </div>

              </div>

            </div>

          </form>

        </div>
      </div>

      <!-- TABLE -->
      <div class="table-responsive">

        <table class="table table-striped">

          <thead>
            <tr>
              <th>#</th>
              <th>Blog</th>
              <th>Tag</th>
              <!-- <th>Status</th> -->
              <th>Created By</th>
              <th width="120">Action</th>
            </tr>
          </thead>

          <!-- DATA -->
          <tbody *ngIf="tagmapdata?.length > 0">

            <tr *ngFor="let tagmap of tagmapdata; let i = index">

              <td>{{ i + 1 }}</td>

              <td>{{ tagmap.title }}</td>

              <td>{{ tagmap.tag_name }}</td>

              <!-- <td>
                <span class="badge badge-success" *ngIf="tagmap.active_status == 1">

                  Active
                </span>

                <span class="badge badge-danger" *ngIf="tagmap.active_status == 0">

                  Pending
                </span>
              </td> -->

              <td>
                <span *ngIf="tagmap.created_by == 1">ODBUS</span>
              </td>

              <td>

                <div class="overlay-edit">

                  <!-- EDIT -->
                  <button type="button" class="btn btn-icon btn-success mr-1"
                    (click)="edittagmap(tagmap); OpenModal(content)">

                    <i class="feather icon-edit"></i>

                  </button>

                  <!-- DELETE -->
                  <button type="button" class="btn btn-icon btn-danger"
                    (click)="openConfirmDialog(confirmDialog, tagmap.id)">

                    <i class="feather icon-trash-2"></i>

                  </button>

                </div>

              </td>

            </tr>

          </tbody>

          <!-- NO DATA -->
          <tbody *ngIf="tagmapdata?.length == 0">

            <tr>
              <td colspan="6" class="text-center">
                No Data Found
              </td>
            </tr>

          </tbody>

        </table>

      </div>

      <!-- DELETE MODAL -->
      <ng-template #confirmDialog let-modal>

        <div class="modal-header">

          <h5>Would you Like to Delete the Record?</h5>

          <button type="button" class="close" (click)="modal.dismiss('Cross click')">

            <span>&times;</span>

          </button>

        </div>

        <div class="modal-body">

          Are you sure you want to delete this record?

        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-primary" (click)="deleteRecord()">

            Confirm Delete

          </button>

          <button type="button" class="btn btn-secondary" (click)="modal.dismiss('Cross click')">

            Cancel

          </button>

        </div>

      </ng-template>

      <!-- ADD / EDIT MODAL -->
      <ng-template #content let-modal>

        <div class="modal-header">

          <h5>{{ ModalHeading }}</h5>

          <button type="button" class="close" (click)="modal.dismiss('Cross click')">

            <span>&times;</span>

          </button>

        </div>

        <div class="modal-body">

          <form [formGroup]="tagmapform" novalidate>

            <div class="row">

              <!-- BLOG -->
              <div class="col-md-6">

                <div class="form-group">

                  <label>
                    Select Blog
                    <span class="text-danger">*</span>
                  </label>

                  <select class="form-control" formControlName="blog_id">

                    <option value="">Select Blog</option>

                    <option *ngFor="let blog of blogList" [value]="blog.id">

                      {{ blog.title }}

                    </option>

                  </select>

                  <small class="text-danger" *ngIf="tagmapform.controls.blog_id.touched &&
                           tagmapform.controls.blog_id.errors?.required">

                    Blog is required

                  </small>

                </div>

              </div>

              <!-- TAG -->
              <div class="col-md-6">

                <div class="form-group">

                  <label>
                    Select Tags
                    <span class="text-danger">*</span>
                  </label>

                  <ng-select [items]="tagdata" bindLabel="tag_name" bindValue="id" [multiple]="true"
                    [closeOnSelect]="false" [searchable]="true" placeholder="Select Tags" formControlName="tag_id">

                  </ng-select>

                  <small class="text-danger" *ngIf="tagmapform.controls.tag_id.touched &&
                           tagmapform.controls.tag_id.errors?.required">

                    Tag is required

                  </small>

                </div>

              </div>

            </div>

          </form>

        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-primary" (click)="addTagmap()">

            {{ ModalBtn }}

          </button>

          <button type="button" class="btn btn-secondary" (click)="modal.dismiss('Cross click')">

            Close

          </button>

        </div>

      </ng-template>

    </app-card>

  </div>
</div>
