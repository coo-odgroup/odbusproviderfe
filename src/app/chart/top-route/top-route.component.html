<div class="row">
  <!-- Top routes -->
  <div class="col-md-6" style="background-color: rgb(242, 234, 234)">
    <!-- Filters -->
    <form [formGroup]="RouteformData" (ngSubmit)="getRoute()">
      <div class="row mb-1 mt-1">
        <div class="col-md-4">
          <label>From Date</label>
          <input type="date" formControlName="start_date" class="form-control" (change)="onStartDateChange($event)" />
        </div>

        <div class="col-md-4">
          <label>To Date</label>
          <input type="date" formControlName="end_date" class="form-control" [min]="minEndDate" [max]="maxEndDate" />
        </div>

        <div class="col-md-4">
          <label>Select</label>
          <select class="form-control" formControlName="order">
            <option value="DESC" selected>High to Low</option>
            <option value="ASC">Low to High</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <select class="form-control" formControlName="limit">
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>

        <div class="col-md-4">
          <div class="mb-3">
            <button class="btn btn-success" type="submit"> Search </button>
            <button class="btn btn-danger" (click)="refresh()"> Refresh </button>
          </div>
        </div>
      </div>
    </form>

    <!-- Chart -->
    <div style="width: 100%; height: 500px">
      <highcharts-chart [Highcharts]="Highcharts" [options]="routeChart"
        style="width: 100%; height: 100%; display: block"></highcharts-chart>
    </div>
  </div>

  <!-- city wise ticket book -->
  <div class="col-md-6" style="background-color: rgb(242, 234, 234)">
    <form [formGroup]="CityFormData" (ngSubmit)="getCity()">
      <div class="row mb-1 mt-1">
        <div class="col-md-4">
          <label>From Date</label>
          <input type="date" formControlName="start_date" class="form-control" (change)="onStartDateChange($event)" />
        </div>

        <div class="col-md-4">
          <label>To Date</label>
          <input type="date" formControlName="end_date" class="form-control" [min]="minEndDate" [max]="maxEndDate" />
        </div>

        <div class="col-md-4">
          <label>Select</label>
          <select class="form-control" formControlName="order">
            <option value="DESC" selected>High to Low</option>
            <option value="ASC">Low to High</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <select class="form-control" formControlName="limit">
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>

        <div class="col-md-4">
          <div class="mb-3">
            <button class="btn btn-success" type="submit"> Search </button>
            <button class="btn btn-danger" (click)="Cityrefresh()"> Refresh </button>
          </div>
        </div>
      </div>
    </form>

    <!-- Chart -->
    <highcharts-chart [Highcharts]="Highcharts" [options]="cityChart"
      style="width: 100%; height: 500px; display: block;">
    </highcharts-chart>

  </div>


  <!-- Day wise ticket book -->
  <div class="col-md-6 mt-5" style="background-color: rgb(242, 234, 234)">
    <form [formGroup]="DayFormData" (ngSubmit)="getdaywise()">
      <div class="row mb-1 mt-1">
        <div class="col-md-4">
          <label>From Date</label>
          <input type="date" formControlName="start_date" class="form-control" (change)="onStartDateChange($event)" />
        </div>

        <div class="col-md-4">
          <label>To Date</label>
          <input type="date" formControlName="end_date" class="form-control" [min]="minEndDate" [max]="maxEndDate" />
        </div>

        <div class="col-md-4">
          <label>&nbsp;</label>
          <div class="mb-3">
            <button class="btn btn-success" type="submit"> Search </button>
            <button class="btn btn-danger" (click)="Dayrefresh()"> Refresh </button>
          </div>
        </div>
      </div>
    </form>

    <!-- Chart -->
    <!-- <highcharts-chart 
      [Highcharts]="Highcharts"
      [options]="cityChart"
      style="width: 100%; height: 500px; display: block;">
    </highcharts-chart> -->

    <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions" [(update)]="updateFlag"
      style="width: 100%; height: 400px; display: block;"></highcharts-chart>

  </div>


  <!-- seat sleeper -->
  <div class="col-md-6 mt-5" style="background-color: rgb(242, 234, 234)">
    <form [formGroup]="DayFormData" (ngSubmit)="getdaywise()">
      <div class="row mb-1 mt-1">
        <div class="col-md-4">
          <label>From Date</label>
          <input type="date" formControlName="start_date" class="form-control" (change)="onStartDateChange($event)" />
        </div>

        <div class="col-md-4">
          <label>To Date</label>
          <input type="date" formControlName="end_date" class="form-control" [min]="minEndDate" [max]="maxEndDate" />
        </div>

        <div class="col-md-4">
          <label>&nbsp;</label>
          <div class="mb-3">
            <button class="btn btn-success" type="submit"> Search </button>
            <button class="btn btn-danger" (click)="Dayrefresh()"> Refresh </button>
          </div>
        </div>
      </div>
    </form>

    <!-- Chart -->
    <!-- <highcharts-chart 
      [Highcharts]="Highcharts"
      [options]="cityChart"
      style="width: 100%; height: 500px; display: block;">
    </highcharts-chart> -->
    <div>
      <highcharts-chart [Highcharts]="Highcharts" [options]="seatChart"
        style="width: 100%; height: 400px; display: block;"></highcharts-chart>
    </div>

  </div>



  <div class="col-md-12 mt-5" style="background-color: rgb(242, 234, 234)">
    <form [formGroup]="operatorFormBooking" (ngSubmit)="getOperator()">
      <div class="row mb-1 mt-1">

        <!-- From Journey Date -->
        <div class="col-md-2">
          <label>From Journey Date</label>
          <input
            type="date"
            formControlName="from_j_date"
            class="form-control"
            (change)="onStartDateChange($event)">
        </div>

        <!-- To Journey Date -->
        <div class="col-md-2">
          <label>To Journey Date</label>
          <input
            type="date"
            formControlName="to_j_date"
            class="form-control"
            [min]="minEndDate"
            [max]="maxEndDate">
        </div>

        <!-- Bus Operator -->
        <div class="col-md-2">
          <label>Bus Operator</label>

          <ng-select
            [items]="busOperators"
            [multiple]="true"
            bindLabel="operator_name"
            bindValue="id"
            placeholder="Select Bus Operator"
            formControlName="bus_operator_id"
            [clearable]="false">

            <ng-template ng-header-tmp>
              <div>
                <button
                  type="button"
                  class="btn btn-link p-0 me-2"
                  (click)="selectAll()">
                  Select All
                </button>

                <button
                  type="button"
                  class="btn btn-link p-0"
                  (click)="clearAll()">
                  Clear All
                </button>
              </div>
            </ng-template>

          </ng-select>
        </div>

        <!-- Order -->
        <div class="col-md-3">
          <label>Select</label>
          <select class="form-control" formControlName="order">
            <option value="DESC">High to Low</option>
            <option value="ASC">Low to High</option>
          </select>
        </div>

        <!-- Limit -->
        <div class="col-md-3">
          <label>Limit</label>
          <select class="form-control" formControlName="limit">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="col-md-2">
          <label>&nbsp;</label>
          <div class="mb-3">
            <button class="btn btn-success me-2" type="submit">
              Search
            </button>
            <button
              type="button"
              class="btn btn-danger"
              (click)="opBookingrefresh()">
              Refresh
            </button>
          </div>
        </div>

      </div>
    </form>

    <div style="width: 100%">
      <highcharts-chart [Highcharts]="Highcharts" [options]="operatorchart"
        style="width: 100%; height: 400px; display: block;">
      </highcharts-chart>
    </div>


  </div>

  <div class="col-md-12 mt-5" style="background-color: rgb(242, 234, 234)">
    <form [formGroup]="operatorFormRevenue" (ngSubmit)="getOperatorRevenue()">
      <div class="row mb-1 mt-1">
        <div class="col-md-2">
          <label>From Journey Date</label>
          <input type="date" formControlName="from_j_date" class="form-control" (change)="onStartDateChange($event)" />
        </div>

        <div class="col-md-2">
          <label>To Journey Date</label>
          <input type="date" formControlName="to_j_date" class="form-control" [min]="minEndDate" [max]="maxEndDate" />
        </div>

        <!-- Bus Operator -->
        <div class="col-md-2">
          <label>Bus Operator</label>

          <ng-select
            [items]="busOperators"
            [multiple]="true"
            bindLabel="operator_name"
            bindValue="id"
            placeholder="Select Bus Operator"
            formControlName="bus_operator_id"
            [clearable]="false">

            <ng-template ng-header-tmp>
              <div>
                <button
                  type="button"
                  class="btn btn-link p-0 me-2"
                  (click)="selectAll()">
                  Select All
                </button>

                <button
                  type="button"
                  class="btn btn-link p-0"
                  (click)="clearAll()">
                  Clear All
                </button>
              </div>
            </ng-template>

          </ng-select>
        </div>

        <div class="col-md-3">
          <label>Select</label>
          <select class="form-control" formControlName="order">
            <option value="DESC" selected>High to Low</option>
            <option value="ASC">Low to High</option>
          </select>
        </div>

        <div class="col-md-3">
          <label>Limit</label>
          <select class="form-control" formControlName="limit">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>

        <div class="col-md-2">
          <label>&nbsp;</label>
          <div class="mb-3">
            <button class="btn btn-success" type="submit"> Search </button>
            <button class="btn btn-danger" (click)="Dayrefresh()"> Refresh </button>
          </div>
        </div>
      </div>
    </form>

    <div style="width: 100%">
      <highcharts-chart [Highcharts]="Highcharts" [options]="operatorRevenuechart"
        style="width: 100%; height: 400px; display: block;">
      </highcharts-chart>
    </div>


  </div>
</div>
