<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="large" color="#fff" type="timer" [fullScreen]="true">
    <p style="color: white"> Loading... </p>
</ngx-spinner>

<div class="row">
    <div class="col-sm-12">
        <app-card cardTitle="Manage Board-Dropping" cardClass="card-datatable" [options]="false" [isCardFooter]="false">

            <div class="mb-3">
                <form *ngIf="searchFrom" [formGroup]="searchFrom">
                    <div class="row align-items-center">
                        <div class="col-md-3" *ngIf="role == '1'">
                            <div>
                                <!-- <label>&nbsp; </label> -->
                                <ng-select [items]="routesData" bindLabel="route_name" bindValue="id"
                                    placeholder="Select Routes" formControlName="route_id" [clearable]="false">
                                </ng-select>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <button type="button" class="btn btn-success w-100" (click)="search()">
                                Search
                            </button>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-danger w-100" (click)="refresh()">
                                Refresh
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <form [formGroup]="updateFrom">
                <textarea formControlName="seo_content" style="display:none;">
                    {{ Data?.seo_content }}
                </textarea>
                <div class="row">
                    <div class="col-md-7">
                        <div [innerHTML]="Data?.seo_content" class="scroll-box"></div>
                    </div>
                    <div class="col-md-5">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="seo-section scroll-box2 seo-full p-3">
                                    <h1>Breadcrumb Schema</h1>
                                    <pre>{{ Data?.breadcrumb_schema | json }}</pre>
                                </div>
                            </div>
                            <div class="col-md-12 mt-3">
                                <div class="seo-section scroll-box2 seo-full p-3">
                                    <h1>FAQ Schema</h1>
                                    <pre>{{ Data?.faq_schema | json }}</pre>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- SAVE BUTTON -->
                <div class="mt-3 text-center">
                    <button class="btn btn-primary" (click)="saveAll()">
                        Update All
                    </button>
                </div>
            </form>
        </app-card>

    </div>
</div>
